name: AQA Tests

# The scenarios themselves, against the environment the repository variables and secrets point at (see the
# framework README, "CI on your own public repository"). Nightly, and on demand with an optional tag or level.
# A failing scenario does not stop the pipeline: the report and the Playwright traces are always uploaded.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Run only scenarios with this tag, e.g. group-preorder, L1, L2, L3, smoke, api, ui (empty = everything)"
        required: false
        default: "group-preorder"

defaults:
  run:
    working-directory: aqa/restaurant-aqa-framework

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UI_URL: ${{ vars.AQA_UI_URL }}
      API_URL: ${{ vars.AQA_API_URL }}
      TESTTABLE_ID: ${{ vars.AQA_TESTTABLE_ID }}
      # The environment allows only 10 concurrent Lambda executions; more parallel scenarios get throttled.
      MAX_PARALLEL_TESTS: ${{ vars.AQA_MAX_PARALLEL_TESTS || '2' }}
      WAITER_USERNAME: ${{ secrets.AQA_WAITER_USERNAME }}
      WAITER_PASSWORD: ${{ secrets.AQA_WAITER_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.AQA_ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.AQA_ADMIN_PASSWORD }}
      TESTTABLE_WAITER_USERNAME: ${{ secrets.AQA_TESTTABLE_WAITER_USERNAME }}
      TESTTABLE_WAITER_PASSWORD: ${{ secrets.AQA_TESTTABLE_WAITER_PASSWORD }}
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build restaurant-aqa-framework.csproj

      - name: Install the browser and its system libraries
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run scenarios
        id: run
        continue-on-error: true
        env:
          TAG: ${{ github.event.inputs.tag || 'group-preorder' }}
        run: |
          if [ -n "$TAG" ]; then filter="/*/*/*/*[Category=$TAG]"; else filter="/*/*/*/*"; fi
          dotnet run --no-build -- --treenode-filter "$filter" --report-trx

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqa-test-results
          path: aqa/restaurant-aqa-framework/TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Outcome
        if: always()
        run: |
          echo "Scenarios outcome: ${{ steps.run.outcome }}"
          echo "Failures are expected for @known-defect scenarios; see the report artifact for the rest."
